configure {
    system {
        name "PE1-a"
    }

    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c6/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type null
        }
    }

    router "Base" {
        interface "system" {
            ipv4 {
                primary {
                    address 10.1.1.1
                    prefix-length 32
                }
            }
        }
        interface "to-P1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 172.16.1.1
                    prefix-length 30
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 21000
                end 30000
            }
            reserved-label-block "Anysec" {
                start-label 32000
                end-label 35999
            }
        }
        ldp {
            admin-state enable
        }
        isis 0 {
            admin-state enable
            level-capability 2
            system-id 0100.0100.1001
            area-address [ 49.0001 ]
            advertise-router-capability area
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    index 1
                }
            }
            interface "to-P1" {
                interface-type point-to-point
            }
        }
    }

    # ---- ANYsec: 1) MACsec CA (crypto material / MKA) ----
    macsec {
        connectivity-association "CA_ANYSEC" {
            admin-state enable
            cipher-suite gcm-aes-xpn-128
            anysec true
            static-cak {
                mka-hello-interval 5
                pre-shared-key 1 {
                    encryption-type aes-128-cmac
                    cak "0123456789ABCDEF0123456789ABCDEF"
                    cak-name "0011"
                }
            }
        }
    }

    # ---- ANYsec: 2) MKA-over-IP + STP + encryption-group ----
    anysec {
        reserved-label-block "Anysec"
        mka-over-ip {
            mka-udp-port 10000
        }
        security-termination-policies {
            policy "STP_ANYSEC" {
                admin-state enable
                local-address 10.1.1.1
                rx-must-be-encrypted false
                protocol sr-isis
                igp-instance-id 0
            }
        }
        tunnel-encryption {
            encryption-group "EG_ANYSEC" {
                admin-state enable
                security-termination-policy "STP_ANYSEC"
                encryption-label 32101
                ca-name "CA_ANYSEC"
                peer-tunnel-attributes {
                    protocol sr-isis
                    igp-instance-id 0
                }
                peer 10.1.1.2 {
                    admin-state enable
                }
            }
        }
    }

    # ---- service: SR-ISIS SDP + Epipe toward Customer1 ----
    service {
        sdp 12 {
            admin-state enable
            delivery-type mpls
            sr-isis true
            far-end {
                ip-address 10.1.1.2
            }
        }
        epipe "anysec-vll-1001" {
            admin-state enable
            service-id 1001
            customer "1"
            sap 1/1/c6/1 {
                admin-state enable
            }
            spoke-sdp 12:1001 {
                admin-state enable
            }
        }
    }
}
